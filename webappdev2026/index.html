<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jane Doe — Lead Engineer portfolio">
  <title>Jane Doe — Lead Engineer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skeleton.css">
  <script src="script.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Jane Doe, Lead Engineer</h1>
    <button
      type="button"
      id="theme-toggle"
      class="theme-toggle"
      aria-pressed="false"
      aria-label="Switch to dark theme"
    >
      Dark mode
    </button>
  </header>

  <nav aria-label="Primary">
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
    </ul>
  </nav>

  <main id="main-content">
    <section id="about">
      <h2>About</h2>
      <p>Jane Doe is a Lead Engineer focused on building reliable, accessible, and maintainable software systems.</p>
    </section>

    <section id="projects-loading" aria-labelledby="projects-loading-title">
      <h2 id="projects-loading-title">Projects</h2>
      <p class="loading-status">Loading projects…</p>

      <ul class="skeleton-list" aria-hidden="true">
        <li class="skeleton-item"></li>
        <li class="skeleton-item"></li>
        <li class="skeleton-item"></li>
        <li class="skeleton-item"></li>
      </ul>
    </section>
  </main>
</body>
</html>
