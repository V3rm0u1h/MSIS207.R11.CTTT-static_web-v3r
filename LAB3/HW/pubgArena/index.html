<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airdrop Arena – PUBG Vietnam Championship</title>
  <meta name="description" content="Zero-drift countdowns to the PVS Grand Finals and the next G-Coin airdrop, with optimistic VIP ticket and G-Coin crate claims (student project, simulation data).">
  <meta name="theme-color" content="#0e1014">
  <!-- Empty inline icon: no /favicon.ico request, so no 404 in the console. -->
  <link rel="icon" href="data:,">
  <style>
    /* T-03A design tokens; every pair's contrast is checked by src/theme.test.js. */
    :root {
      --arena-background: #0e1014;
      --arena-surface: #181c23;
      --arena-text: #f5f5f4;
      --arena-muted: #c8c6bd;
      --arena-accent: #f2a900;
      --arena-live: #4ade80;
      --arena-danger: #f87171;
      --arena-border: #6b7280;
      --arena-focus: #38bdf8;
      --arena-radius: 0.75rem;
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
      color: var(--arena-text);
      background: var(--arena-background);
    }
    body { margin: 0; min-height: 100vh; }
    #root { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 2rem; }
    #root > header { margin-bottom: 1.5rem; }
    #root > footer { margin-top: 2rem; font-size: 0.875rem; color: var(--arena-muted); }
    #root > footer p { margin: 0; }
    .eyebrow { margin: 0; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--arena-accent); }
    h1 { margin: 0.25rem 0; font-size: clamp(1.75rem, 5vw, 2.5rem); text-transform: uppercase; letter-spacing: 0.04em; }
    .tagline { margin: 0; color: var(--arena-muted); }
    :focus-visible { outline: 3px solid var(--arena-focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <main id="root"></main>
  <noscript>JavaScript must be enabled to see the live countdowns.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
