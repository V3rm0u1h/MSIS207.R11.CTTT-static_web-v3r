<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Accessible Data-Grid demo built with Mini-React and native table elements.">
    <title>Mini-React — Accessible Data-Grid</title>
    <link rel="stylesheet" href="dataGrid.css">
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; background: var(--grid-zebra-bg); color: var(--grid-text); }
        body { margin: 0; padding: 2rem 1rem; }
        main { max-width: 64rem; margin-inline: auto; }
        .demo-intro { margin: 0 0 1.25rem; color: var(--grid-muted); line-height: 1.6; }
    </style>
</head>
<body>
<main>
    <h1>Accessible Data-Grid</h1>
    <p class="demo-intro">A native, screen-reader-friendly table with a contrast-checked theme (PRD 1), column sorting and text filtering (PRD 2). Pagination and arrow-key navigation arrive in later commits.</p>
    <!-- Unlabelled mount point: the grid supplies its own region label from the caption. -->
    <section id="grid-root"></section>
    <noscript>JavaScript must be enabled to render the data grid.</noscript>
</main>
<script type="module">
    import { mountDataGrid } from "./mountDataGrid.js";

    const firstNames = ["An", "Binh", "Chi", "Dung", "Giang", "Hai", "Khanh", "Linh", "Minh", "Nam"];
    const lastNames = ["Nguyen", "Tran", "Le", "Pham", "Hoang"];
    const departments = ["Engineering", "Design", "Finance", "Marketing", "Support"];
    const offices = ["Ha Noi", "Ho Chi Minh City", "Da Nang", "Singapore"];

    // Deterministic sample data so the demo and audits are reproducible.
    const rows = Array.from({ length: 50 }, (_, index) => {
        const month = String((index % 12) + 1).padStart(2, "0");
        const day = String((index * 7) % 28 + 1).padStart(2, "0");
        return {
            name: `${lastNames[index % lastNames.length]} ${firstNames[index % firstNames.length]} ${index + 1}`,
            department: departments[(index * 3) % departments.length],
            office: offices[(index * 5) % offices.length],
            salary: 42000 + ((index * 3779) % 60) * 1000,
            startDate: `${2015 + (index % 10)}-${month}-${day}`
        };
    });

    mountDataGrid(document.querySelector("#grid-root"), {
        id: "employee-grid",
        caption: "Employee directory (50 people)",
        locale: "en-US",
        columns: [
            { key: "name", label: "Name", type: "string", sortable: true, filterable: true },
            { key: "department", label: "Department", type: "string", sortable: true, filterable: true },
            { key: "office", label: "Office", type: "string", sortable: true, filterable: true },
            { key: "salary", label: "Salary (USD)", type: "number", sortable: true },
            { key: "startDate", label: "Start date", type: "date", sortable: true }
        ],
        rows
    });
</script>
</body>
</html>
